<!doctype html><html lang="id"><meta charset="utf-8"><title>Hubungkan Shopee</title>
<style>body{width:320px;padding:18px;font:14px system-ui;color:#293139;background:#f7f5f0}h2{font-size:19px}p{line-height:1.5}input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:6px}button{background:#bd4c2e;color:white;border:0}#status{font-size:12px;white-space:pre-wrap}</style>
<h2>Gunakan tab Shopee ini</h2><p>Buka tab Shopee tempat kamu sudah login. Tempel kode pairing dari dashboard lokal.</p>

<button id="connect">Hubungkan tab ini</button><button id="disconnect">Putuskan koneksi</button><p id="status">Tidak membaca atau mengekspor cookie. Akses terbatas ke tab Shopee pilihanmu.</p><script src="popup.js"></script></html>
